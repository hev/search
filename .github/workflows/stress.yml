name: Stress

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

concurrency:
  group: stress-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  HEVSEARCH_S3_ENDPOINT: http://127.0.0.1:9000
  HEVSEARCH_S3_ACCESS_KEY: minioadmin
  HEVSEARCH_S3_SECRET_KEY: minioadmin
  HEVSEARCH_S3_BUCKET: hevsearch-test

jobs:
  minio-stress:
    name: nightly MinIO stress
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Install protobuf
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler libprotobuf-dev

      - name: Install Rust 1.94
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          cache-on-failure: true

      - name: Install Go for pinned MinIO fixture source
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.2"
          cache: false

      - name: Build pinned MinIO fixture
        run: ./scripts/build-test-minio "$RUNNER_TEMP/minio"

      - name: Start MinIO and create test bucket
        run: |
          MINIO_ROOT_USER=minioadmin MINIO_ROOT_PASSWORD=minioadmin \
            "$RUNNER_TEMP/minio" server "$RUNNER_TEMP/minio-data" \
            --address 127.0.0.1:9000 --console-address 127.0.0.1:9001 \
            > "$RUNNER_TEMP/minio.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/minio.pid"
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9000/minio/health/live; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:9000/minio/health/live
          ./scripts/init-test-bucket

      - name: cargo test (MinIO stress only)
        run: |
          cargo test --workspace --no-fail-fast _stress_minio -- \
            --ignored

      - name: Dump MinIO logs on failure
        if: failure()
        run: tail -200 "$RUNNER_TEMP/minio.log" || true
