name: CI

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "*.md"
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  # Strip debug info from CI builds. It is the dominant contributor to
  # target/ size for the lance + datafusion + arrow graph, and the
  # runner's ~14 GB margin is thin once test binaries land. Backtraces
  # are already set to "short", so there is nothing to lose here.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  # Tests fall back to these defaults when the env vars are not set,
  # matching docker-compose.yml for local parity. Setting them
  # explicitly in CI makes the wiring visible at a glance.
  HEVSEARCH_S3_ENDPOINT: http://127.0.0.1:9000
  HEVSEARCH_S3_ACCESS_KEY: minioadmin
  HEVSEARCH_S3_SECRET_KEY: minioadmin
  HEVSEARCH_S3_BUCKET: hevsearch-test

jobs:
  test:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest ships with ~14 GB free. Lance + DataFusion in
      # debug profile fit, but the margin is thin once test binaries
      # land. This action reclaims ~25 GB without touching anything
      # the build needs.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          # The Rust toolchain is installed fresh below via dtolnay, so
          # the preinstalled language tool-cache is dead weight here.
          # Reclaiming it buys ~8 GB.
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Install protobuf
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler libprotobuf-dev

      # Rust 1.94 matches Dockerfile.dev. rustfmt / clippy must be
      # installed as components up front — note that rustup's proxy
      # misreports them as missing otherwise.
      - name: Install Rust 1.94
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          # Makes the cache key depend on Cargo.lock so a dependency
          # change busts the cache cleanly. Default already does this;
          # restated here for clarity.
          shared-key: ci
          cache-on-failure: true

      # Public MinIO images were withdrawn. Build the same pinned fixture
      # source, bind loopback only, and sign bucket creation with curl.
      - name: Install Go for pinned MinIO fixture source
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.2"
          cache: false

      - name: Build pinned MinIO fixture
        run: ./scripts/build-test-minio "$RUNNER_TEMP/minio"

      - name: Start MinIO and create test bucket
        run: |
          MINIO_ROOT_USER=minioadmin MINIO_ROOT_PASSWORD=minioadmin \
            "$RUNNER_TEMP/minio" server "$RUNNER_TEMP/minio-data" \
            --address 127.0.0.1:9000 --console-address 127.0.0.1:9001 \
            > "$RUNNER_TEMP/minio.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/minio.pid"
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9000/minio/health/live; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:9000/minio/health/live
          ./scripts/init-test-bucket

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test (unit + default)
        run: cargo test --workspace --no-fail-fast

      # MinIO-backed integration tests are all gated #[ignore] so the
      # previous step skips them. This step opts them in, minus:
      #   * `_aws` variants — need real AWS credentials, not in CI
      #   * `_stress_` variants — repeat-count stress suites, overkill per PR
      - name: cargo test (integration, MinIO-backed)
        run: |
          cargo test --workspace --no-fail-fast -- \
            --ignored \
            --skip _aws \
            --skip _stress_

      - name: Dump MinIO logs on failure
        if: failure()
        run: tail -200 "$RUNNER_TEMP/minio.log" || true
