# Local dev harness for hevsearch.
#
# MinIO provides the S3-compatible fixture. Build its pinned source locally;
# its former public images and mc images are no longer available.

services:
  minio:
    build:
      context: .
      dockerfile: Dockerfile.test-minio
    image: hevsearch-minio-test:source-07c3a429
    container_name: hevsearch-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio-init:
    build:
      context: .
      dockerfile: Dockerfile.test-minio
    image: hevsearch-minio-test:source-07c3a429
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/usr/local/bin/init-test-bucket", "http://minio:9000", "hevsearch"]

  hevsearch:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hevsearch-api
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      HEVSEARCH_S3_ENDPOINT: http://minio:9000
      HEVSEARCH_S3_ACCESS_KEY: minioadmin
      HEVSEARCH_S3_SECRET_KEY: minioadmin
      HEVSEARCH_S3_BUCKET: hevsearch
      HEVSEARCH_BIND: "0.0.0.0:3000"
      RUST_LOG: info
    ports:
      - "3000:3000"

volumes:
  minio-data:
